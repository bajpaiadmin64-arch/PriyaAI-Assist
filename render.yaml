services:
  - type: web
    name: priya-ai-assist
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
        # Optional: enables Gemini as the chat provider (https://aistudio.google.com/apikey).
      - key: SARVAM_API_KEY
        sync: false
        # Required for chat + natural Hindi / Hinglish voices (https://dashboard.sarvam.ai).
      - key: ELEVENLABS_API_KEY
        sync: false
        # Optional fallback voice provider (https://elevenlabs.io).
      - key: NODE_ENV
        value: production
