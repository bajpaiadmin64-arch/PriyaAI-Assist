<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priya AI — Personal Technology Expert</title>
  <meta name="description" content="Priya — your personal female AI technology expert. Hindi, English & Hinglish. Coding, hosting, AI tools, troubleshooting." />
  <meta name="theme-color" content="#0c0e18" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='0.35' cy='0.3' r='0.9'%3E%3Cstop offset='0' stop-color='%23f3f7fa'/%3E%3Cstop offset='0.3' stop-color='%23aef3fa'/%3E%3Cstop offset='0.7' stop-color='%2335d6e8'/%3E%3Cstop offset='1' stop-color='%230e7c8c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='29' fill='url(%23g)'/%3E%3Ccircle cx='24' cy='22' r='9' fill='white' opacity='0.4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .boot-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: #080b10;
      font-family: 'Inter', system-ui, sans-serif;
      z-index: 9999;
    }
    .boot-orb {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f3f7fa 0%, #aef3fa 22%, #35d6e8 55%, #0e7c8c 100%);
      box-shadow: 0 0 40px rgba(53, 214, 232, 0.45), 0 0 90px rgba(53, 214, 232, 0.2);
      animation: bootPulse 1.4s ease-in-out infinite;
    }
    .boot-text { color: #a9b5c0; font-size: 15px; letter-spacing: 0.4px; margin: 0; }
    @keyframes bootPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-screen">
      <div class="boot-orb" aria-hidden="true"></div>
      <p class="boot-text">Loading Priya AI...</p>
      <noscript><p class="boot-text">Priya AI needs JavaScript. Please enable it and refresh.</p></noscript>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
